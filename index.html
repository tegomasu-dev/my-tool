<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>my-tool</title>
  <meta name="description" content="my-tool は、毎日の作業をもっとシンプルにするツールです。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="#" class="logo">my-tool</a>
      <nav class="nav">
        <a href="#features">特長</a>
        <a href="#how">使い方</a>
        <a href="#start" class="btn btn-small">はじめる</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1>面倒な作業は、<br>my-tool におまかせ。</h1>
        <p class="lead">my-tool は、面倒な繰り返し作業をまとめて片づけるためのツールです。</p>
        <div class="hero-actions">
          <a href="#start" class="btn">無料ではじめる</a>
          <a href="#features" class="btn btn-ghost">詳しく見る</a>
        </div>
      </div>
    </section>

    <section id="features" class="section">
      <div class="container">
        <h2>特長</h2>
        <div class="cards">
          <article class="card">
            <h3>かんたん</h3>
            <p>インストールしてすぐ使えます。難しい設定はいりません。</p>
          </article>
          <article class="card">
            <h3>はやい</h3>
            <p>軽い動作で、待ち時間なく作業を進められます。</p>
          </article>
          <article class="card">
            <h3>自由に拡張</h3>
            <p>自分の使い方に合わせて機能を追加できます。</p>
          </article>
        </div>
      </div>
    </section>

    <section id="how" class="section section-alt">
      <div class="container">
        <h2>使い方</h2>
        <ol class="steps">
          <li><span class="step-num">1</span>ダウンロードする</li>
          <li><span class="step-num">2</span>やりたいことを選ぶ</li>
          <li><span class="step-num">3</span>あとは my-tool におまかせ</li>
        </ol>
      </div>
    </section>

    <section id="start" class="section cta">
      <div class="container">
        <h2>さっそく試してみましょう</h2>
        <a href="https://github.com/tegomasu-dev/my-tool" class="btn">GitHub で見る</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>&copy; 2026 my-tool</small>
    </div>
  </footer>
</body>
</html>
